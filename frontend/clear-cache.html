<!DOCTYPE html>
<html>
<head>
  <title>Clear Cache - MJ Electricals Admin</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      text-align: center;
    }
    .success { color: #10b981; font-size: 24px; margin: 20px 0; }
    .btn {
      background: #ff6b35;
      color: white;
      padding: 15px 30px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      margin: 10px;
    }
    .btn:hover { background: #ff8c42; }
    .info {
      background: #fff3cd;
      border: 1px solid #ffc107;
      padding: 15px;
      border-radius: 8px;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <h1>🧹 Cache Cleared Successfully!</h1>
  
  <div class="success">
    ✅ All old localStorage data has been removed
  </div>
  
  <div class="info">
    <strong>What was cleared:</strong><br>
    • admin_orders<br>
    • admin_products<br>
    • admin_banners<br>
    • admin_categories<br>
    • All session storage<br>
    • Service worker cache
  </div>
  
  <p>Your admin dashboard should now work correctly.</p>
  
  <a href="admin-dashboard.html" class="btn">Go to Admin Dashboard</a>
  <a href="index.html" class="btn">Go to Homepage</a>
  
  <script>
    // Nuclear cache clear
    (function() {
      console.log('🧹 Starting nuclear cache clear...');
      
      // Clear all localStorage
      try {
        const keysToRemove = [];
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (key && (key.includes('admin') || key.includes('orders') || key.includes('products') || key.includes('banners') || key.includes('categories'))) {
            keysToRemove.push(key);
          }
        }
        keysToRemove.forEach(key => localStorage.removeItem(key));
        console.log('✅ Cleared localStorage:', keysToRemove);
      } catch(e) {
        console.error('localStorage clear error:', e);
      }
      
      // Clear all sessionStorage
      try {
        sessionStorage.clear();
        console.log('✅ Cleared sessionStorage');
      } catch(e) {
        console.error('sessionStorage clear error:', e);
      }
      
      // Clear service worker cache
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(registrations => {
          registrations.forEach(registration => {
            registration.unregister();
            console.log('✅ Unregistered service worker');
          });
        });
      }
      
      // Clear cache storage
      if ('caches' in window) {
        caches.keys().then(names => {
          names.forEach(name => {
            caches.delete(name);
            console.log('✅ Deleted cache:', name);
          });
        });
      }
      
      console.log('🎉 Cache clear complete!');
    })();
  </script>
</body>
</html>
